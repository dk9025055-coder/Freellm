services:
  - type: web
    name: relaygate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROUTER_MASTER_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ROUTER_VAULT_JSON
        sync: false
      - key: ROUTER_VAULT_PASSPHRASE
        sync: false